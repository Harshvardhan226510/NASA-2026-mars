name: Build desktop releases

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both verified installers as the latest release
        type: boolean
        default: false
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

concurrency:
  group: nasa-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm test
      - run: npm run test:upstream
      - run: npm run runtime:science
      - run: ../.venv-build/Scripts/python.exe -m unittest discover -s tests -p 'test_*.py'
        working-directory: apps/desktop/web
      - run: npm run runtime:inference
      - run: npm run runtime:speech
      - run: npm run runtime:voice-pack
      - run: node scripts/verify-native-voice.mjs
      - run: node scripts/local-voice-catalog.mjs
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-desktop
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/release/*-setup.exe
            apps/desktop/release/optional-voice/*
            apps/desktop/artifacts/native-voice-win32-x64.json

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Install native Bookworm toolchain
        working-directory: /
        run: apt-get update && apt-get install -y ca-certificates git python3 python3-venv python3-dev build-essential cmake pkg-config binutils xz-utils
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm test
      - run: npm run test:upstream
      - run: npm run runtime:science
      - run: ../.venv-build/bin/python -m unittest discover -s tests -p 'test_*.py'
        working-directory: apps/desktop/web
      - run: npm run runtime:inference
      - run: npm run runtime:speech
      - run: npm run runtime:voice-pack
      - run: node scripts/verify-native-voice.mjs
      - run: node scripts/local-voice-catalog.mjs
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-desktop
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/optional-voice/*
            apps/desktop/artifacts/native-voice-linux-arm64.json

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [windows, linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        working-directory: apps/desktop
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ github.run_id }}
      BUILD_SHA: ${{ github.sha }}
      RELEASE_VERSION: '0.3.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-desktop'
          path: apps/desktop/downloaded
      - run: python3 scripts/publish-verified-build.py prepare
      - run: python3 scripts/publish-verified-build.py publish
