<!doctype html><html><head><meta charset="utf-8"><title>Sun physical-scale rendering check</title><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css"><script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script><style>html,body,#globe{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12;color:#e6eff0;font:16px system-ui}aside{position:absolute;top:24px;left:24px;background:#101924dd;padding:20px;max-width:420px}button{padding:10px;margin:8px 8px 0 0}output{display:block;white-space:pre-wrap;line-height:1.6}</style></head><body><div id="globe"></div><aside><strong>Sun · physical scale check</strong><output id="result">Starting…</output><button id="wide">60° camera</button><button id="optical">1° optical camera</button><button id="occult">Behind Mars</button></aside><script type="module">
import {SolarLighting} from '../../src/solar-lighting.js';
import {sunModel} from '../../src/sun-model.js';
import {marsSun} from '../../src/solar-geometry.js';
const C=window.Cesium,at='2026-11-03T00:00:00Z',model=sunModel(marsSun(at)),R=3396190,ellipsoid=new C.Ellipsoid(R,R,R);
const viewer=new C.Viewer('globe',{ellipsoid,globe:new C.Globe(ellipsoid),baseLayer:false,skyBox:false,skyAtmosphere:false,animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,navigationHelpButton:false,sceneModePicker:false,fullscreenButton:false,selectionIndicator:false,infoBox:false,requestRenderMode:true});
viewer.scene.backgroundColor=C.Color.fromCssColorString('#090d12');viewer.scene.globe.baseColor=C.Color.fromCssColorString('#ae7761');viewer.scene.globe.depthTestAgainstTerrain=true;
const lighting=Object.assign(Object.create(SolarLighting.prototype),{viewer,enabled:true,shadows:false,currentTime:()=>at,updateTelemetryOnly(){}});lighting.initSunEntity();lighting.update();
const direction=C.Cartesian3.normalize(lighting.sunPosition,new C.Cartesian3()),right=C.Cartesian3.normalize(C.Cartesian3.cross(direction,C.Cartesian3.UNIT_Z,new C.Cartesian3()),new C.Cartesian3()),up=C.Cartesian3.cross(right,direction,new C.Cartesian3());
let mode='wide';function show(next){mode=next;const range=R*3,position=C.Cartesian3.multiplyByScalar(direction,mode==='occult'?-range:range,new C.Cartesian3());viewer.camera.setView({destination:position,orientation:{direction,up}});viewer.camera.frustum.fov=(mode==='optical'?1:60)*Math.PI/180;lighting.update();viewer.scene.requestRender();}
viewer.scene.postRender.addEventListener(()=>{const sun=C.SceneTransforms.worldToWindowCoordinates(viewer.scene,lighting.sunPosition),edge=C.Cartesian3.add(lighting.sunPosition,C.Cartesian3.multiplyByScalar(right,model.diameter_m/2,new C.Cartesian3()),new C.Cartesian3()),rim=C.SceneTransforms.worldToWindowCoordinates(viewer.scene,edge);document.getElementById('result').textContent=`Diameter: 1,391,400 km\nMars–Sun distance: ${(model.distance_m/1e9).toFixed(1)} million km\nAngular diameter: ${model.angular_diameter_deg.toFixed(3)}°\nProjected diameter: ${sun&&rim?(2*Math.hypot(sun.x-rim.x,sun.y-rim.y)).toFixed(2):'outside view'} px\nCamera: ${mode==='optical'?'1° optical zoom':mode==='occult'?'Sun behind Mars':'60°'}\nFar plane: ${(viewer.camera.frustum.far/1e9).toFixed(1)} million km`;});
viewer.scene.renderError.addEventListener((_scene,error)=>{document.getElementById('result').textContent='RENDER ERROR: '+error.message;});for(const id of ['wide','optical','occult'])document.getElementById(id).onclick=()=>show(id);show('wide');
</script></body></html>
